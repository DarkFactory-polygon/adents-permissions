[project]
name = "agentperm"
version = "0.1.0"
description = "Реестр прав агентов: CLI check / expired"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.4",
]

[project.scripts]
agentperm = "agentperm.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentperm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
